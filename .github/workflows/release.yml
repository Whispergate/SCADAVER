name: Release

on:
  push:
    tags:
      - 'v*'
  # Retry without cutting a new tag. The v1.7.2 run sat queued for 24 hours and was
  # cancelled, which looks like a build failure and is not one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Create the release once ────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3  # v2
        with:
          name: scadaver ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

  # ── Build binaries in parallel ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: scadaver.exe
            asset_name: scadaver-windows-x86_64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: scadaver
            asset_name: scadaver-linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: scadaver
            asset_name: scadaver-macos-arm64

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: scadaver
            asset_name: scadaver-macos-x86_64

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact }} ${{ matrix.asset_name }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3  # v2
        with:
          files: ${{ matrix.asset_name }}

  # ── Publish to crates.io ───────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - name: Publish scadaver
        run: cargo publish -p scadaver --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
