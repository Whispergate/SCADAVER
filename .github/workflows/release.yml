name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: scadaver.exe
            asset_name: scadaver-windows-x86_64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: scadaver
            asset_name: scadaver-linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: scadaver
            asset_name: scadaver-macos-arm64

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: scadaver
            asset_name: scadaver-macos-x86_64

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload to release
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3  # v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          name: ${{ matrix.asset_name }}
