name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scadaver

    steps:
      # The protocol library is pinned by tag in Cargo.toml, so there is no second checkout.
      # A sibling checkout here is what hid the drift that turned main red in August: CI
      # compiled against casket main while the working tree compiled against a local copy.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4
        with:
          path: scadaver

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: clippy

      - name: Start Mosquitto broker
        run: |
          sudo apt-get install -y mosquitto mosquitto-clients
          printf 'allow_anonymous true\nlistener 1883\n' > /tmp/mosquitto.conf
          mosquitto -d -c /tmp/mosquitto.conf
          sleep 2

      - name: Build
        run: cargo build --verbose

      # No `cargo fmt --check` yet: the tree has 339 formatting diffs. Land one mechanical
      # `cargo fmt --all` commit first, then add the gate. Reviewing it with `git diff -w`
      # keeps it honest.
      - name: Clippy
        run: cargo clippy -- -D warnings

      # Phase 4 flips this to blocking. It fails today by design: cli.rs, tui.rs and
      # web/routes.rs still call casket directly (127, 53 and 156 times).
      # - name: No surface may call casket directly
      #   run: bash scripts/check-parity.sh

      # The ops_* suites spawn python simulators inside `cargo test`, so the interpreter has
      # to be ready before the first test run, not after it.
      - name: Install Python simulators and independent protocol clients
        run: pip install -r sim/requirements.txt -r sim/requirements-test.txt

      - name: Test
        run: cargo test --verbose

      - name: MQTT integration tests
        env:
          TEST_MQTT_HOST: 127.0.0.1
        run: cargo test --test mqtt_integration

      - name: Simulator provenance and independent protocol checks
        run: python3 -m unittest sim.test_run_all sim.test_protocol_conformance

      - name: Start external simulators
        run: |
          python3 scripts/sim_opcua.py > /tmp/sim_opcua.log 2>&1 &
          sleep 10
          echo "=== sim_opcua ===" && cat /tmp/sim_opcua.log || true

      - name: In-process loopback integration tests
        run: |
          cargo test --test iec104_integration
          cargo test --test enip_integration
          cargo test --test beckhoff_integration
          cargo test --test ewon_integration
          cargo test --test omron_integration
          cargo test --test mitsubishi_integration
          cargo test --test phoenix_integration
          cargo test --test schneider_integration
          cargo test --test dnp3_integration
          cargo test --test modbus_integration
          cargo test --test snmp_integration
          cargo test --test bacnet_integration
          cargo test --test rockwell_integration
          cargo test --test s7_integration
          cargo test --test library_api
          cargo test --test macros_derive

      - name: Simulator-backed integration tests
        env:
          TEST_OPCUA_HOST: 127.0.0.1
        run: |
          cargo test --test opcua_integration
