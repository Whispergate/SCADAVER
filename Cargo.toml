[workspace]
members = [".", "scadaver-macros"]
resolver = "2"

[package]
name = "scadaver"
version = "1.1.0"
edition = "2021"
authors = ["SawyersPresent (https://github.com/SawyersPresent)"]
description = "Unified ICS Red Team Multi-Tool, Rust edition"
repository = "https://github.com/Whispergate/SCADAVER"
keywords = ["ics", "scada", "pentest", "modbus", "redteam"]
categories = ["network-programming", "command-line-utilities"]
license-file = "LICENSE"
readme = "README.md"

[[bin]]
name = "scadaver"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "scadaver"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:colored",
    "dep:tabled",
    "dep:console",
    "dep:indicatif",
    "dep:dialoguer",
    "dep:dirs",
    "dep:toml",
    "dep:rusqlite",
    "dep:chrono",
    "dep:ratatui",
    "dep:crossterm",
    "dep:axum",
    "dep:tokio",
]
macros = ["dep:scadaver-macros"]

# ── Library deps (always compiled) ───────────────────────────────────────────
[dependencies]
anyhow = "1"
thiserror = "1"
ureq = { version = "2", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
socket2 = { version = "0.5", features = ["all"] }
base64 = "0.22"
rand = "0.8"
subtle = "2"
network-interface = "2"

# ── CLI / binary deps (optional, enabled by the "cli" feature) ────────────────
clap = { version = "4", features = ["derive", "color"], optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
colored = { version = "2", optional = true }
tabled = { version = "0.16", features = ["std"], optional = true }
dialoguer = { version = "0.11", optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }
dirs = { version = "5", optional = true }
toml = { version = "0.8", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
chrono = { version = "0.4", optional = true }

# ── Proc-macro companion (optional, enabled by the "macros" feature) ──────────
scadaver-macros = { version = "1.0", path = "scadaver-macros", optional = true }

[dev-dependencies]
scadaver-macros = { path = "scadaver-macros" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
# All errors are anyhow::Error: per-function error docs would be misleading noise
missing_errors_doc = "allow"
# Internal panics are on parse/unwrap of compile-time-safe literals
missing_panics_doc = "allow"
# Red-team scan functions: callers decide what to do with results
must_use_candidate = "allow"
return_self_not_must_use = "allow"
