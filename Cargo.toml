[package]
name = "scadaver"
version = "1.7.2"
edition = "2021"
rust-version = "1.87"
authors = ["SawyersPresent (https://github.com/SawyersPresent)"]
description = "Unified ICS Red Team Multi-Tool, Rust edition"
repository = "https://github.com/Whispergate/SCADAVER"
keywords = ["ics", "scada", "pentest", "modbus", "redteam"]
categories = ["network-programming", "command-line-utilities"]
license-file = "LICENSE"
exclude = ["tests/"]
readme = "README.md"

[[bin]]
name = "scadaver"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:colored",
    "dep:tabled",
    "dep:console",
    "dep:indicatif",
    "dep:dialoguer",
    "dep:dirs",
    "dep:toml",
    "dep:ipnetwork",
    "dep:native-tls",
    "dep:rusqlite",
    "dep:chrono",
    "dep:ratatui",
    "dep:crossterm",
    "dep:axum",
    "dep:tokio",
]
capture = ["casket/capture"]

[dependencies]
casket = "0.1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
subtle = "2"
rand = "0.8"

clap = { version = "4", features = ["derive", "color"], optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util"], optional = true }
colored = { version = "2", optional = true }
tabled = { version = "0.16", features = ["std"], optional = true }
dialoguer = { version = "0.11", optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }
dirs = { version = "5", optional = true }
toml = { version = "0.8", optional = true }
ipnetwork = { version = "0.21", optional = true }
native-tls = { version = "0.2", features = ["vendored"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
casket-macros = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
