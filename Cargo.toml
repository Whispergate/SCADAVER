[package]
name = "scadaver-rs"
version = "1.0.0"
edition = "2021"
authors = ["Saif Yaseen <saif.yas@hotmail.com>"]
description = "Unified ICS Red Team Multi-Tool — Rust edition"
repository = "https://github.com/SawyersPresent/scadaver-rs"
keywords = ["ics", "scada", "pentest", "modbus", "redteam"]
categories = ["network-programming", "command-line-utilities"]
license = "GPL-3.0-or-later"

[[bin]]
name = "scadaver"
path = "src/main.rs"

[lib]
name = "scadaver_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
anyhow = "1"
thiserror = "1"
ureq = { version = "2", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
colored = "2"
tabled = { version = "0.16", features = ["std"] }
dialoguer = "0.11"
indicatif = "0.17"
socket2 = { version = "0.5", features = ["all"] }
base64 = "0.22"
rand = "0.8"
network-interface = "2"
console = "0.15"
dirs = "5"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
# All errors are anyhow::Error — per-function error docs would be misleading noise
missing_errors_doc = "allow"
# Internal panics are on parse/unwrap of compile-time-safe literals
missing_panics_doc = "allow"
# Red-team scan functions: callers decide what to do with results
must_use_candidate = "allow"
return_self_not_must_use = "allow"
