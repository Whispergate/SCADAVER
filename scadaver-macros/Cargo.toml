[package]
name = "scadaver-macros"
version = "1.1.0"
edition = "2021"
authors = ["SawyersPresent (https://github.com/SawyersPresent)"]
description = "Proc-macro companion for the scadaver ICS red team toolkit"
repository = "https://github.com/Whispergate/SCADAVER"
keywords = ["ics", "scada", "pentest", "macros", "derive"]
categories = ["network-programming", "development-tools::procedural-macro-helpers"]
license-file = "../LICENSE"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"
